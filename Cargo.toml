[package]
name = "mappar"
description = "A modern OpenStreetMap editor for Desktop and Browsers built using Rust and egui"
authors = ["bolli24"]
version = "0.1.0"
edition = "2021"
default-run = "mappar"

[workspace]
members = ["src/macros", "css"]

[dependencies]
macros = { path = "src/macros" }

egui = { version = "0.28.1" }
epaint = { version = "0.28.1" }
image = { version = "0.25.2", default-features = false, features = ["jpeg", "png"] }
glam = { version = "0.29.0", features = ["serde"] }

log = { version = "0.4", features = ["release_max_level_info"] }
simplelog = "0.12.2"
serde = { version = "1", features = ["derive"] }
thiserror = "1.0.63"

reqwest = { version = "0.12.5" }
quick-xml = { version = "0.36.1", default-features = false }
bytes = "1.6.1"
flate2 = "1.0.31"

chrono = { version = "0.4", features = ["wasmbind"] }

lru = "0.12.3"
itertools = "0.13.0"
regex = "1.10.5"

puffin = "0.19.0"
puffin_http = "0.16.0"
tar = "0.4.41"
directories = "5.0.1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
eframe = { version = "0.28.1", default-features = false, features = [
    # "accesskit",     # Make egui comptaible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts",
    "wgpu",
    "x11",
    "wayland",
    "persistence",
] }
tokio = { version = "1.39.1", features = ["macros", "sync", "rt-multi-thread", "fs"] }

# web:
[target.'cfg(target_family = "wasm")'.dependencies]
eframe = { version = "0.28.1", default-features = false, features = [
    "default_fonts",
    "glow", # Use instead of wgpu because eframe does not support webgl with wgpu by default
    "persistence",
] }
tokio = { version = "1.39.1", default-features = false, features = ["macros", "sync", "rt"] }
js-sys = "0.3.69"
web-sys = { version = "0.3.69", features = ["Navigator", "StorageManager", "IdbFactory", "IdbOpenDbRequest"] }
wasm-bindgen = "0.2.92"
wasm-bindgen-futures = "0.4.42"
web-time = "1.1.0"
gloo-worker = "0.5.0"

[[bin]] # This is used for gloo-worker
name = "dummy_worker"
path = "src/imagery/dummy_worker.rs"
test = false
bench = false
doc = false
doctest = false
plugin = false
proc-macro = false
harness = false

[profile.dev]
opt-level = 1   # this should not be 0 for the performance of the web worker to not suck
                # but it messed with debugging

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2   # fast and small wasm

#   level   size
#    0      8
#    1      8
#    2      5.7
#    3      5.9
#    s      5.0
#    z      4.7
