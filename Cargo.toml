[package]
name = "mappar"
description = "A modern OpenStreetMap editor for desktop and browsers built using Rust and egui."
authors = ["bolli24"]
version = "0.1.0-alpha"
edition = "2021"
default-run = "mappar"

[workspace]
members = ["src/macros", "css"]

[dependencies]
mappar-macros = { path = "src/macros" }
mappar-css = { path = "css" }

egui = "0.29.1"
epaint = "0.29.1"
egui_extras = "0.29.1"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
] }
resvg = { version = "0.44", default-features = false }
glam = { version = "0.29", features = ["serde"] }

log = { version = "0.4", features = ["release_max_level_info"] }
simplelog = "0.12.2"
serde = { version = "1.0.215", features = ["derive"] }
thiserror = "2"
ariadne = "0.5"

reqwest = "0.12.9"
url = "*"
quick-xml = { version = "0.37", default-features = false }
bytes = "1.8.0"
bytemuck = "1.19"

chrono = { version = "0.4", features = ["wasmbind"] }

ringbuffer = "0.15.0"
lru = "0.12.5"
itertools = "0.13.0"
regex = "1.11.1"

puffin = "0.19"
puffin_http = "0.16"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
eframe = { version = "0.29.1", default-features = false, features = [
    # "accesskit",     # Make egui comptaible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts",
    "wgpu",
    "x11",
    "wayland",
    "persistence",
] }
tokio = { version = "1.41.1", features = [
    "macros",
    "sync",
    "rt-multi-thread",
    "fs",
] }
flate2 = "1.0"
tar = "0.4"
open = "5.3.1"

# web:
[target.'cfg(target_family = "wasm")'.dependencies]
eframe = { version = "0.29.1", default-features = false, features = [
    "default_fonts",
    "glow",          # Use instead of wgpu because eframe does not support webgl with wgpu by default
    "persistence",
] }
tokio = { version = "1.41.1", default-features = false, features = [
    "macros",
    "sync",
    "rt",
] }
js-sys = "0.3.74"
web-sys = { version = "0.3.74", features = [
    "Navigator",
    "StorageManager",
    "IdbFactory",
    "IdbOpenDbRequest",
    "Location",
] }
wasm-bindgen = "0.2.97"
wasm-bindgen-futures = "0.4.47"
web-time = "1.1.0"
gloo-worker = "0.5.0"

[build-dependencies]
vergen-gitcl = "1"

[[bin]] # This is used for gloo-worker
name = "dummy_worker"
path = "src/imagery/dummy_worker.rs"
test = false
bench = false
doc = false
doctest = false
proc-macro = false
harness = false

[profile.dev]
opt-level = 1 # this should not be 0 for the performance of the web worker to not suck
# but it messes with debugging

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2 # fast and small wasm

# .wasm sizes in MB
#   level   size
#    0      8
#    1      8
#    2      5.7
#    3      5.9
#    s      5.0
#    z      4.7
