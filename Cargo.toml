[package]
name = "mappar"
description = "A modern OpenStreetMap editor for desktop and browsers built using Rust and egui."
authors = ["bolli24"]
version = "0.1.0-alpha"
edition = "2024"
default-run = "mappar"

[workspace]
members = ["src/macros", "css"]

[dependencies]
mappar-macros = { path = "src/macros" }
mappar-css = { path = "css" }

derive-new = "0.7.0"

egui = "0.31"
epaint = "0.31"
egui_extras = "0.31"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
] }
resvg = { version = "0.45", default-features = false }
glam = { version = "0.30", features = ["serde"] }
egui-phosphor = { version = "0.9", default-features = false, features = [
    "bold",
] }

log = { version = "0.4", features = ["release_max_level_info"] }
simplelog = "0.12"
thiserror = "2"
ariadne = "0.5"

serde = { version = "1.0", features = ["derive"] }
serde-inline-default = "0.2"
serde_path_to_error = "0.1"
strum = { version = "0.27", features = ["derive"] }

reqwest = "0.12"
url = "2.5"
quick-xml = { version = "0.37", features = [
    "serialize",
    "overlapped-lists",
], default-features = false }
bytes = "1.10"
bytemuck = "1.22"

chrono = { version = "0.4", features = ["wasmbind"] }
web-time = "1.1.0"

undo = { version = "0.52", default-features = false, features = ["alloc"] }
lru = "0.14"
indexmap = "2.9"
itertools = "0.14"
regex = "1.11"
lasso = { version = "0.7", features = ["serialize"] }

statig = "0.3"

chumsky = "0.10.1"

puffin = "0.19"
puffin_http = "0.16"

celes = "2.6"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    # "accesskit",     # Make egui comptaible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts",
    "wgpu",
    "x11",
    "wayland",
    "persistence",
] }
tokio = { version = "1.44", features = [
    "macros",
    "sync",
    "rt-multi-thread",
    "fs",
] }
tokio-stream = { version = "0.1.17", features = ["fs"] }
flate2 = "1.1"
tar = "0.4"
open = "5.3"
directories = "6.0"

# web:
[target.'cfg(target_family = "wasm")'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",          # Use instead of wgpu because eframe does not support webgl with wgpu by default
    "persistence",
] }
tokio = { version = "1.44", default-features = false, features = [
    "macros",
    "sync",
    "rt",
] }
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = [
    "Navigator",
    "StorageManager",
    "IdbFactory",
    "IdbOpenDbRequest",
    "Location",
] }
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
gloo-worker = "0.5.0"

[build-dependencies]
vergen-gitcl = "1"

[[bin]] # This is used for gloo-worker
name = "dummy_worker"
path = "src/imagery/dummy_worker.rs"
test = false
bench = false
doc = false
doctest = false
proc-macro = false
harness = false

[profile.dev]
# opt-level = 1     # this should not be 0 for the performance of the web worker to not suck

# Optimize just some dependencies to improve performance but keep debug build compile time low
[profile.dev.package."image"]
opt-level = 2

[profile.dev.package."bincode"]
opt-level = 2

[profile.dev.package."serde"]
opt-level = 2

[profile.release]
opt-level = 2 # fast and small wasm

# .wasm sizes in MB
#   level   size
#    0      8
#    1      8
#    2      5.7
#    3      5.9
#    s      5.0
#    z      4.7
