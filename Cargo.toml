[package]
name = "mappar"
description = "A modern OpenStreetMap for Desktop built using Rust, egui and skia"
authors = ["bolli24"]
version = "0.1.0"
edition = "2021"

[dependencies]
egui = "0.28.1"
eframe = { version = "0.28.1", default-features = false, features = [
    # "accesskit",     # Make egui comptaible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts",
    "wgpu",
    "x11",
    "wayland",
    "persistence"
] }
skia-safe = "0.75.0"
glam = { version = "0.28.0", features = ["serde"] }

log = "0.4"
simple_logger = "5.0.0"
serde = { version = "1", features = ["derive"] }

reqwest = { version = "0.12.5" }
tokio = { version = "1.38.0", features = ["macros", "sync", "rt-multi-thread"] }
poll-promise = { version = "0.3.0", features = ["tokio"] }
quick-xml = { version = "0.36.0", default-features = false }

chrono = "0.4.38"

lru = "0.12.3"

[profile.release]
opt-level = 2 # fast and small wasm

[profile.dev.package."*"]
opt-level = 2
