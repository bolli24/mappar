[package]
name = "mappar"
description = "A modern OpenStreetMap for Desktop built using Rust, egui and skia"
authors = ["bolli24"]
version = "0.1.0"
edition = "2021"

[dependencies]
egui = { version = "0.28.1", features = ["mint"] }
eframe = { version = "0.28.1", default-features = false, features = [
    # "accesskit",     # Make egui comptaible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts",
    "glow",
    "x11",
    "wayland",
    "persistence",
] }
epaint = { version = "0.28.1", features = ["mint"] }
image = { version = "0.25.1" ,default-features = false, features = ["jpeg"]}
glam = { version = "0.28.0", features = ["serde", "mint"] }
mint = "0.5.9"

log = "0.4"
simple_logger = "5.0.0"
serde = { version = "1", features = ["derive"] }

reqwest = { version = "0.12.5" }
quick-xml = { version = "0.36.1", default-features = false }
bytes = "1.6.1"

chrono = { version = "0.4", features = ["wasmbind"] }

lru = "0.12.3"
itertools = "0.13.0"
regex = "1.10.5"

thiserror = "1.0.63"

puffin = "0.19.0"
puffin_http = "0.16.0"

macros = { path = "src/macros" }
async-trait = "0.1.81"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.39.1", features = ["macros", "sync", "rt-multi-thread", "fs"] }

# web:
[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1.39.1", default-features = false, features = ["macros", "sync", "rt"] }
js-sys = "0.3.69"
web-sys = { version = "0.3.69", default-features = false, features = ["Navigator", "StorageManager"] }
wasm-bindgen = "0.2.92"
wasm-bindgen-futures = "0.4.42"
web-time = "1.1.0"


# to access the DOM (to hide the loading text)
[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.69"

[profile.dev]
lto = false

[profile.release]
opt-level = 2 # fast and small wasm
lto = false

[profile.dev.package."*"]
opt-level = 2
