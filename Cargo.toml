[package]
name = "mappar"
description = "A modern OpenStreetMap editor for Desktop and Browsers built using Rust and egui"
authors = ["bolli24"]
version = "0.1.0"
edition = "2021"
default-run = "mappar"

[dependencies]
macros = { path = "src/macros" }

egui = { version = "0.28.1" }
eframe = { version = "0.28.1", default-features = false, features = [
    # "accesskit",     # Make egui comptaible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts",
    "wgpu",
    "x11",
    "wayland",
    "persistence",
] }
wgpu = { version = "*", features = ["webgpu", "webgl"] }
epaint = { version = "0.28.1" }
image = { version = "0.25.2", default-features = false, features = ["jpeg"] }
glam = { version = "0.28.0", features = ["serde"] }

log = "0.4"
simple_logger = "5.0.0"
serde = { version = "1", features = ["derive"] }
thiserror = "1.0.63"

reqwest = { version = "0.12.5" }
quick-xml = { version = "0.36.1", default-features = false }
bytes = "1.6.1"

chrono = { version = "0.4", features = ["wasmbind"] }

lru = "0.12.3"
itertools = "0.13.0"
regex = "1.10.5"

puffin = "0.19.0"
puffin_http = "0.16.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.39.1", features = ["macros", "sync", "rt-multi-thread", "fs"] }

# web:
[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1.39.1", default-features = false, features = ["macros", "sync", "rt"] }
js-sys = "0.3.69"
web-sys = { version = "0.3.69", features = ["Navigator", "StorageManager", "IdbFactory", "IdbOpenDbRequest"] }
wasm-bindgen = "0.2.92"
wasm-bindgen-futures = "0.4.42"
web-time = "1.1.0"
gloo-worker = "0.5.0"

[[bin]] # This is used for gloo-worker
name = "dummy_worker"
path = "src/imagery/dummy_worker.rs"
test = false
bench = false
doc = false
doctest = false
plugin = false
proc-macro = false
harness = false

[profile.dev]
opt-level = 1   # this is needed to the performance of the web worker not suck

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 2   # fast and small wasm

#   level   size
#    0      8
#    1      8
#    2      5.7
#    3      5.9
#    s      5.0
#    z      4.7
