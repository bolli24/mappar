[package]
name = "mappar"
description = "A modern OpenStreetMap editor for desktop and browsers built using Rust and egui."
authors = ["bolli24"]
version = "0.1.0-alpha"
edition = "2024"
default-run = "mappar"

[workspace]
members = ["src/macros", "css"]

[dependencies]
mappar-macros = { path = "src/macros" }
mappar-css = { path = "css" }

egui = "0.34"
epaint = "0.34"
egui_extras = "0.34"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
] }
resvg = { version = "0.47", default-features = false }
glam = { version = "0.32", features = ["serde"] }
lyon_tessellation = "1.0"
egui-phosphor = { version = "0.12", default-features = false, features = [
    "bold",
] }

log = { version = "0.4", features = ["release_max_level_info"] }
simplelog = "0.12"
thiserror = "2"
anyhow = "1.0"

ariadne = "0.6"

serde = { version = "1.0", features = ["derive"] }
serde-inline-default = "1.0"
serde_path_to_error = "0.1"
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }

derive-new = "0.7"

futures = "0.3"
tokio-util = "0.7"

reqwest = "0.13"
url = "2.5"
quick-xml = { version = "0.39", features = [
    "serialize",
    "overlapped-lists",
], default-features = false }
bytes = "1.11"
bytemuck = "1.24"
oauth2 = { version = "5" }
httparse = "1.10"

dotenvy_macro = "0.15"

chrono = { version = "0.4", features = ["wasmbind"] }
web-time = "1.1"

undo = { version = "0.52", default-features = false, features = ["alloc"] }
lru = "0.16"
indexmap = "2.13"
itertools = "0.14"
regex = "1.12"
lasso = { version = "0.7", features = ["serialize"] }
smallvec = { version = "1.15", features = ["serde"] }
either = "1.15"
nonzero_ext = "0.3"
bitflags = "2.11"

statig = "0.4"

chumsky = "0.12"

fxhash = "0.2"

puffin = "0.20"
puffin_http = "0.17"

celes = "2.6"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
eframe = { version = "0.34", default-features = false, features = [
    # "accesskit",     # Make egui comptaible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts",
    "wgpu",
    "x11",
    "wayland",
    "persistence",
] }
wgpu = { version = "29", features = ["vulkan", "dx12", "metal", "gles"] }
tokio = { version = "1.49", features = [
    "macros",
    "sync",
    "rt-multi-thread",
    "fs",
] }
flate2 = "1.1"
tar = "0.4"
open = "5.3"
directories = "6.0"
pico-args = "0.5"
keyring = { version = "3.6", features = [
    "windows-native",
    "apple-native",
    "linux-native",
] }

# web:
[target.'cfg(target_family = "wasm")'.dependencies]
eframe = { version = "0.34", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "persistence",
] }
wgpu = { version = "29", features = ["webgpu", "webgl"] }
tokio = { version = "1.49", default-features = false, features = [
    "macros",
    "sync",
    "rt",
] }
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Navigator",
    "BroadcastChannel",
    "MessageEvent",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-worker = "0.6"
indexed_db_futures = { version = "0.6", features = ["serde", "typed-arrays"] }

[build-dependencies]
vergen-gitcl = "9"

[[bin]] # This is used for gloo-worker
name = "dummy_worker"
path = "src/imagery/dummy_worker.rs"
test = false
bench = false
doc = false
doctest = false
proc-macro = false
harness = false
required-features = []

# Optimize just some dependencies to improve performance but keep debug build compile time low
[profile.dev.package."image"]
opt-level = 2

[profile.dev.package."bincode"]
opt-level = 2

[profile.dev.package."serde"]
opt-level = 2

[profile.release]
opt-level = 2 # fast and small wasm

# .wasm sizes in MB
#   level   size
#    0      8
#    1      8
#    2      5.7
#    3      5.9
#    s      5.0
#    z      4.7
