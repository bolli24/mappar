# The Docker image that will be used to build your app
image: rust:latest
# Functions that should be executed before the build script is run
before_script:
  - apt update
  - apt install -y libdbus-1-dev pkg-config
  - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
  - cargo binstall -y trunk
  - trunk --version
  - wget -O brotli.deb http://http.us.debian.org/debian/pool/main/b/brotli/brotli_1.0.9-2+b6_amd64.deb && dpkg -i brotli.deb
  - brotli --version
  - touch .env
pages:
  script:
    - trunk build --release --dist=public
    - find public -type f -regex '.*\.\(htm\|html\|txt\|text\|js\|css\|wasm\|svg\)$' -exec brotli -kf9 {} \;
  artifacts:
    paths:
      # The folder that contains the files to be exposed at the Page URL
      - public
  rules:
    # This ensures that only pushes to the default branch will trigger
    # a pages deploy
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

desktop:
  script:
    - cargo test
