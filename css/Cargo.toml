[package]
name = "mappar-css"
authors = ["bolli24"]
description = "A MapCSS parser with powerful error reporting."
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mapcss-validate"
path = "src/bin/validate.rs"

[dependencies]
chumsky = { version = "0.12" }
logos = "0.16"
ecolor = "0.34"
ariadne = "0.6"
phf = { version = "0.13", features = ["macros"] }
color-hex = "0.2.0"
thiserror = "2.0"
